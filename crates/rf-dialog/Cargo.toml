[package]
name = "rf-dialog"
description = "rustyfiles as the Open / Save dialog: a COM server DLL loaded into other apps"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rustyfiles_dialog"
# the DLL other apps load, and a library for the request types rustyfiles reads
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
windows-core = "0.62"
