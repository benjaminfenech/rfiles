[package]
name = "rf-linux"
description = "Linux platform layer: the same API as rf-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "qoi", "exr", "hdr", "dds", "pnm"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
kamadak-exif = "0.6"
psd = "0.3"
rf-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
libc = "0.2"
chrono.workspace = true
notify.workspace = true
rayon.workspace = true
md-5.workspace = true
# thumbnail cache files carry their source in PNG text chunks
png = "0.18"
sha1.workspace = true
sha2.workspace = true
crc32fast.workspace = true
