[package]
name = "rf-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rfiles"
path = "src/main.rs"

[[bin]]
name = "directlook"
path = "src/bin/directlook.rs"

[dependencies]
# the speed test asks rustyfiles.com for a short result link (already in the tree through velopack)
ureq = "3.5"
rf-core.workspace = true
rf-archive.workspace = true
rf-player.workspace = true
rustdecoder.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger = "0.11"
parking_lot.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
smallvec.workspace = true
serde.workspace = true
serde_json.workspace = true
# font previews (already in the tree through resvg)
ttf-parser = "0.25"
# DirectLook: e-mail (.eml) previews
mail-parser = "1.0"
toml.workspace = true
dirs.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
image.workspace = true
raw-window-handle.workspace = true
chrono.workspace = true

[target.'cfg(unix)'.dependencies]
# the Linux platform layer, used under rf-win's name (see lib.rs)
rf-linux.workspace = true
# no-op stand-in for the Windows fork's `gpui_windows::…` API
gpui-windows-shim = { path = "../gpui-windows-shim" }
