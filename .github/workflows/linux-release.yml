name: Linux release

# Builds the Linux packages (.deb, .rpm and Flatpak for x86_64 and aarch64, the Arch package)
# for a tag and attaches them to that tag's GitHub release.
#
# To release: change packaging/linux/RELEASE to the new tag (v0.5.2-linux.1) and
# packaging/linux/release-notes.md to its notes, in a PR. When it lands on main this creates
# the tag and a draft release, builds and attaches the packages, then publishes it. If a
# build fails, the draft stays: run this by hand with the tag once it's fixed. (A tag pushed from here
# doesn't start other workflows, so everything happens in this one.)
#
# A tag pushed by hand works too: its release is created here if it doesn't exist. Run it by
# hand with a tag to (re)attach that tag's packages.
on:
  push:
    branches: [main]
    paths: ["packaging/linux/RELEASE"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to (e.g. v0.5.2-linux.1)
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      created: ${{ steps.t.outputs.created }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tag (and release) to build
        id: t
        env:
          # through the environment, never pasted into the script
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          created=false
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "'$tag' isn't a tag like v0.5.2-linux.1" >&2; exit 1; }
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            # a RELEASE change on main: a new tag here, with its release and notes
            tag=$(tr -d '[:space:]' < packaging/linux/RELEASE)
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "RELEASE: '$tag' isn't a tag like v0.5.2-linux.1" >&2; exit 1; }
            if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "$tag exists already: nothing to release"
              tag=""
            else
              # the tag first (a draft release has none until it's published), then the
              # release as a draft: it's published once the packages are attached
              gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
              gh release create "$tag" --draft --verify-tag --title "rfiles ${tag#v}" \
                --notes-file packaging/linux/release-notes.md
              created=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "created=$created" >> "$GITHUB_OUTPUT"

  packages:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/linux-packages.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  publish:
    needs: [tag, packages]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: rfiles-*
          path: dist
          merge-multiple: true
      - name: The release
        if: needs.tag.outputs.created != 'true'
        run: |
          # a hand-pushed tag (or a run by hand): its release, if there isn't one yet
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "rfiles ${TAG#v}" --notes "rfiles $TAG."
      # the public key to check the signature against (the one built into rfiles)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.tag.outputs.tag }}
          path: src
          sparse-checkout: packaging/linux/release-key.pub.pem
          sparse-checkout-cone-mode: false
      - name: Sign the checksums
        env:
          # Ed25519 private key (PEM); its public half is packaging/linux/release-key.pub.pem.
          # rfiles' updater installs only files listed in a SHA256SUMS this key signed.
          SIGNING_KEY: ${{ secrets.RFILES_SIGNING_KEY }}
        run: |
          [[ -n "$SIGNING_KEY" ]] || { echo "the RFILES_SIGNING_KEY secret is missing: not publishing unsigned packages" >&2; exit 1; }
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          cd dist
          rm -f SHA256SUMS SHA256SUMS.sig
          sha256sum -- * > SHA256SUMS
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          rm -f "$key"
          # a key that doesn't match the built-in one would make every update fail: stop here
          openssl pkeyutl -verify -pubin -inkey ../src/packaging/linux/release-key.pub.pem -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          cat SHA256SUMS
      - name: Attach the packages and publish
        run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
