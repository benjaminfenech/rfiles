name: Linux packages

# .deb and .rpm for x86_64 and aarch64, built on Ubuntu 22.04 so they run on glibc 2.35 and
# newer (Debian 12+, Ubuntu 22.04+, Fedora, openSUSE), the Arch package from
# packaging/arch/PKGBUILD, and a Flatpak bundle for x86_64 and aarch64. Each package is installed in a clean container before it's
# uploaded as an artifact. Downloads from package mirrors are tried three times: a mirror's
# hiccup shouldn't fail a build. linux-release.yml runs this for a tag and attaches the packages.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/linux-packages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to build
        type: string
        required: true

env:
  NFPM_VERSION: "2.48.0"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            nfpm_arch: x86_64
          - runner: ubuntu-22.04-arm
            nfpm_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # the version counts commits
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of 3 failed: $*"; [ $i = 3 ] || sleep 15; done; return 1; }
          retry sudo apt-get update
          retry sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libfontconfig1-dev libfreetype-dev libasound2-dev
      - name: nfpm
        run: |
          base=https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION
          file=nfpm_${NFPM_VERSION}_Linux_${{ matrix.nfpm_arch }}.tar.gz
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/checksums.txt" | grep " $file\$" | sha256sum -c -
          sudo tar -xzf "$file" -C /usr/local/bin nfpm
      - name: Build
        run: cargo build --locked --release -p rf-app --bins
      - name: Package
        run: packaging/linux/build-packages.sh
      - name: Install the .deb on Debian 12
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:12 bash -euc '
            retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of 3 failed: $*"; [ $i = 3 ] || sleep 15; done; return 1; }
            retry apt-get update -qq
            retry apt-get install -y -qq /dist/*.deb >/dev/null
            if ldd /usr/lib/rfiles/rfiles /usr/lib/rfiles/directlook | grep "not found"; then exit 1; fi
            test -L /usr/bin/rfiles && test -f /usr/share/applications/rfiles.desktop'
      - name: Install the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -euc '
            retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of 3 failed: $*"; [ $i = 3 ] || sleep 15; done; return 1; }
            retry dnf install -y -q --setopt=retries=5 /dist/*.rpm
            if ldd /usr/lib/rfiles/rfiles /usr/lib/rfiles/directlook | grep "not found"; then exit 1; fi
            test -L /usr/bin/rfiles && test -f /usr/share/applications/rfiles.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: rfiles-${{ matrix.nfpm_arch }}
          path: dist/*

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git before checkout: without it, checkout downloads a tarball (no history for pkgver)
      - name: Update and install git
        run: |
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of 3 failed: $*"; [ $i = 3 ] || sleep 15; done; return 1; }
          retry pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Build with makepkg
        run: |
          # makepkg doesn't run as root; -s installs the dependencies through sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --system --add safe.directory '*'
          chown -R builder: .
          cd packaging/arch
          sudo -u builder env RFILES_SOURCE="git+file://$GITHUB_WORKSPACE#commit=$(git rev-parse HEAD)" \
            makepkg -s --noconfirm
      - name: Install and check
        run: |
          pacman -U --noconfirm packaging/arch/rfiles-git-[0-9]*.pkg.tar.zst
          if ldd /usr/lib/rfiles/rfiles /usr/lib/rfiles/directlook | grep "not found"; then exit 1; fi
          test -L /usr/bin/rfiles && test -f /usr/share/applications/rfiles.desktop
          mkdir dist && cp packaging/arch/rfiles-git-[0-9]*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rfiles-arch-x86_64
          path: dist/*

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # flatpak-builder's sandbox (bubblewrap) needs it
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(packaging/linux/version.sh)
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # the image has the Platform and Sdk; only the Rust extension is missing
          retry() { for i in 1 2 3; do "$@" && return 0; echo "attempt $i of 3 failed: $*"; [ $i = 3 ] || sleep 15; done; return 1; }
          retry flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.rust-stable//26.08
          flatpak-builder --disable-rofiles-fuse --force-clean \
            --repo=repo build-flatpak packaging/flatpak/io.github.benjaminfenech.rfiles.yml
          mkdir dist
          # installing the bundle fetches the runtime from Flathub
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "dist/rfiles-$version.${{ matrix.arch }}.flatpak" io.github.benjaminfenech.rfiles
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: rfiles-flatpak-${{ matrix.arch }}
          path: dist/*
